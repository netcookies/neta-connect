name: Auto Generate Widget Index

on:
  push:
    branches:
      - main
    paths:
      - 'widgets/**/*.jar'
      - 'widgets/**/metadata.json'
  workflow_dispatch:

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate index.json
        run: bash .github/scripts/generate-widget-index.sh

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet widgets/index.json; then
            echo "📭 index.json 没有变化"
            exit 0
          fi

          git add widgets/index.json
          git commit -m "chore: auto-generate index.json from widgets directory"
          git push

          echo "✅ index.json 已更新并推送"
