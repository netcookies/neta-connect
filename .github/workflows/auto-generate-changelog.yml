name: Auto generate changelog

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: "${{ (github.event_name == 'push' && contains(github.event.head_commit.message, 'ci: Bump Version')) || github.event_name == 'workflow_dispatch' }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: 'netcookies/isulewTools'
      
      - name: Generate Changelog
        uses: smichard/conventional_changelog@2.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.PAT }}
      
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          repository: 'netcookies/neta-connect'
          path: 'neta-connect'
          
      - name: Change Workdir && Config Git && Commit Changelog
        run: |
          cd "${{ github.workspace }}/neta-connect/"
          cp -r "${{ github.workspace }}/CHANGELOG.md" "${{ github.workspace }}/neta-connect/"
          perl -0777 -i -pe 's/^### Other[ \t]*\r?\n- Bump Version.*\r?\n[ \t]*\r?\n//mg' CHANGELOG.md
          perl -i -pe 's/^- Bump Version.*\r?\n//mg' CHANGELOG.md
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/netcookies/neta-connect.git
          git add CHANGELOG.md
          git commit -m "docs: :robot: changelog file generated" || echo "No changes to commit"
          git push origin

  build-deploy:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v3

      - name: Get latest release version
        id: get_version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/netcookies/neta-connect/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build site with version replacement
        run: |
          cd site
          # 复制changelog
          cp ../CHANGELOG.md docs/changelog.md

          # 替换版本号占位符
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Replacing version with: $VERSION"

          # 替换 docusaurus.config.js 中的版本号
          sed -i "s/label: 'v1.9.2'/label: '$VERSION'/g" docusaurus.config.js

          # 替换 index.js 中的版本号
          sed -i "s/Latest: v1.9.2/Latest: $VERSION/g" src/pages/index.js

          # 替换 intro.md 中的版本号（如果存在）
          find i18n docs -name "intro.md" -type f -exec sed -i "s/v1.9.2/$VERSION/g" {} \;

          npm install
          npm run build
          rm -f docs/changelog.md

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/build
          cname: neta.nznd.org

