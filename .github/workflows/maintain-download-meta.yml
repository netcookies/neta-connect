name: Maintain Download Meta

on:
  push:
    branches:
      - main
    paths:
      - "models/**"
      - "archive/**"
      - "widgets/**"
      - "!**/*.meta"
      - "!**/*.part*"
      - "!**/*.sha256"
      - "!models/index.json"
      - "!widgets/index.json"
      - "!widgets/**/metadata.json"
      - "!widgets/**/version.json"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - changed

permissions:
  contents: write

concurrency:
  group: maintain-download-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-meta:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate meta files and split parts
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_SLUG: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          MODE="changed"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${MANUAL_MODE:-all}"
          fi

          python3 .github/scripts/generate-download-meta.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --repo-slug "$REPO_SLUG" \
            --branch "$DEFAULT_BRANCH" \
            --mode "$MODE" \
            --base "$BEFORE_SHA" \
            --head "$HEAD_SHA"

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A models archive widgets

          if git diff --staged --quiet; then
            echo "📭 No meta or part changes to commit"
            exit 0
          fi

          git commit -m "chore: auto-generate download meta [skip ci]"

          MAX_RETRIES=5
          RETRY=0
          while [ "$RETRY" -lt "$MAX_RETRIES" ]; do
            if git push; then
              echo "✅ Generated files pushed"
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Push failed, retrying with rebase... ($RETRY/$MAX_RETRIES)"
            sleep $((RETRY * 2))
            git pull --rebase
          done

          echo "❌ Failed to push generated files after $MAX_RETRIES retries"
          exit 1
