name: Update Widget Index

on:
  push:
    branches:
      - main
    paths:
      - 'widgets/index.json'
  workflow_dispatch:

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update generatedAt timestamp
        run: |
          # 更新 index.json 中的 generatedAt 字段
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/\"generatedAt\": \".*\"/\"generatedAt\": \"$TIMESTAMP\"/" widgets/index.json

          # 检查是否有变化
          if git diff --quiet widgets/index.json; then
            echo "No changes to commit"
            exit 0
          fi

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add widgets/index.json
          git commit -m "chore: update index.json timestamp [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
