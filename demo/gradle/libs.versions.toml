# ============================================================
# Gradle Version Catalog
# ============================================================

[versions]
# ============================================================
# SDK & Build Configuration
# ============================================================
compileSdk = "36"
minSdk = "30"
targetSdk = "36"
javaVersion = "11"

# ============================================================
# Application Versioning
# ============================================================
appVersionCode = "158"
appVersionName = "2.1.9-beta.18"
minCompatibleBridgeVersion = "2.1.7"

# ============================================================
# Build Tools & Plugins
# ============================================================
#noinspection AndroidGradlePluginVersion
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.2"

# ============================================================
# AndroidX Core
# ============================================================
coreKtx = "1.18.0"
appcompat = "1.7.1"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
savedstate = "1.5.0"
annotation = "1.10.0"
json = "20260522"

# ============================================================
# Compose
# ============================================================
composeBom = "2026.05.01"
# 注意：所有 Compose 库版本由 BOM 统一管理

# ============================================================
# Kotlin Libraries
# ============================================================
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"

# ============================================================
# Database
# ============================================================
room = "2.8.4"

# ============================================================
# Security
# ============================================================
security = "1.1.0"
opensslPrefab = "1.1.1n"

# ============================================================
# Network & Serialization
# ============================================================
okhttp = "5.3.2"
gson = "2.14.0"
retrofit = "3.0.0"

# ============================================================
# Background Tasks
# ============================================================
workmanager = "2.11.2"

# ============================================================
# UI Components
# ============================================================
haze = "1.7.2"
colorpicker = "0.7.0"
richtextCompose = "1.0.0-alpha04"

# ============================================================
# Utilities
# ============================================================
hiddenapibypass = "6.1"
processphoenix = "3.0.0"
dexmaker = "2.28.6"
zxing = "3.5.4"
nanohttpd = "2.3.1"
tyme4kt = "1.4.5"
tarsosdsp = "2.4.1"
perfetto = "1.0.1"

# ============================================================
# Audio
# ============================================================
oboe = "1.10.0"

# ============================================================
# Testing
# ============================================================
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxTestCore = "1.7.0"
espressoCore = "3.7.0"
robolectric = "4.16.1"
benchmark = "1.4.1"
mockk = "1.14.9"
mockkAndroid = "1.14.9"

# ============================================================
# Libraries
# ============================================================
[libraries]

# ------------------------------------------------------------
# AndroidX Core
# ------------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }

# ------------------------------------------------------------
# AndroidX Lifecycle
# ------------------------------------------------------------
androidx-lifecycle-common = { group = "androidx.lifecycle", name = "lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ------------------------------------------------------------
# Compose (所有版本由 BOM 管理)
# ------------------------------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# ------------------------------------------------------------
# Compose UI Extensions
# ------------------------------------------------------------
compose-colorpicker = { group = "com.godaddy.android.colorpicker", name = "compose-color-picker", version.ref = "colorpicker" }
compose-colorpicker-android = { group = "com.godaddy.android.colorpicker", name = "compose-color-picker-android", version.ref = "colorpicker" }
json = { module = "org.json:json", version.ref = "json" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockkAndroid" }
richtext-commonmark = { group = "com.halilibo.compose-richtext", name = "richtext-commonmark", version.ref = "richtextCompose" }
richtext-ui-material3 = { group = "com.halilibo.compose-richtext", name = "richtext-ui-material3", version.ref = "richtextCompose" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

# ------------------------------------------------------------
# Kotlin Libraries
# ------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# ------------------------------------------------------------
# Database (Room)
# ------------------------------------------------------------
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ------------------------------------------------------------
# Security
# ------------------------------------------------------------
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }
openssl-prefab = { group = "com.fpliu.ndk.pkg.prefab.android.21", name = "openssl", version.ref = "opensslPrefab" }

# ------------------------------------------------------------
# Network & Serialization
# ------------------------------------------------------------
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# ------------------------------------------------------------
# Background Tasks
# ------------------------------------------------------------
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# ------------------------------------------------------------
# Android Utilities
# ------------------------------------------------------------
hiddenapibypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenapibypass" }
processphoenix = { group = "com.jakewharton", name = "process-phoenix", version.ref = "processphoenix" }
dexmaker = { group = "com.linkedin.dexmaker", name = "dexmaker", version.ref = "dexmaker" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
nanohttpd-core = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { group = "org.nanohttpd", name = "nanohttpd-websocket", version.ref = "nanohttpd" }
tyme4kt = { group = "cn.6tail", name = "tyme4kt", version.ref = "tyme4kt" }
tarsosdsp = { group = "com.github.st-h", name = "TarsosDSP", version.ref = "tarsosdsp" }
androidx-tracing-perfetto = { group = "androidx.tracing", name = "tracing-perfetto", version.ref = "perfetto" }

# ------------------------------------------------------------
# Audio
# ------------------------------------------------------------
oboe = { group = "com.google.oboe", name = "oboe", version.ref = "oboe" }

# ------------------------------------------------------------
# Testing
# ------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-benchmark-junit4 = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "benchmark" }

# ============================================================
# Plugins
# ============================================================
[plugins]
# Android
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# Kotlin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

# Code Generation
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
